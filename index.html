<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Host</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 768px) {
      body { flex-direction: row; }
    }
    .sidebar {
      background: #181818;
      border-bottom: 1px solid #2a2a2a;
      padding: 1rem;
    }
    @media (min-width: 768px) {
      .sidebar {
        width: 240px;
        flex-shrink: 0;
        border-bottom: none;
        border-right: 1px solid #2a2a2a;
        padding: 1.5rem 1rem;
      }
    }
    .sidebar h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin: 0 0.75rem 0.75rem;
    }
    .menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .menu a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      color: #ccc;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .menu a:hover { background: #242424; color: #fff; }
    .menu a.active { background: #2d2d2d; color: #fff; font-weight: 600; }
    .badge {
      font-size: 0.7rem;
      color: #888;
      white-space: nowrap;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    @media (min-width: 600px) {
      main { padding: 2rem; }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .player {
      width: 100%;
      max-width: 900px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    video {
      width: 100%;
      display: block;
    }
    .coming-soon {
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 1.1rem;
    }
    [hidden] { display: none !important; }
    footer {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>
  <nav class="sidebar">
    <h2>Videos</h2>
    <ul class="menu" id="menu"></ul>
  </nav>
  <main>
    <h1 id="title"></h1>
    <div class="player">
      <video id="video" controls playsinline preload="auto">
        Your browser does not support the video tag.
      </video>
      <div class="coming-soon" id="coming-soon" hidden>Video coming soon</div>
    </div>
    <footer>Self-hosted video</footer>
  </main>
  <script>
    // Add new videos here. Leave src empty to show "coming soon".
    const videos = [
      { id: 'fight-arena', title: 'Fight Arena', src: 'videos/fight_arena_web.mp4' },
      { id: 'shotguns-dual-wield', title: 'Shotguns and Dual Wield', src: '' },
    ];

    const menu = document.getElementById('menu');
    const title = document.getElementById('title');
    const video = document.getElementById('video');
    const comingSoon = document.getElementById('coming-soon');

    videos.forEach(v => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + v.id;
      a.dataset.id = v.id;
      a.textContent = v.title;
      if (!v.src) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = 'Coming soon';
        a.appendChild(badge);
      }
      li.appendChild(a);
      menu.appendChild(li);
    });

    function show() {
      const current = videos.find(v => '#' + v.id === location.hash) || videos[0];
      title.textContent = current.title;
      document.title = current.title + ' | Video Host';
      menu.querySelectorAll('a').forEach(a => {
        a.classList.toggle('active', a.dataset.id === current.id);
      });
      video.pause();
      if (current.src) {
        video.src = current.src;
        video.hidden = false;
        comingSoon.hidden = true;
      } else {
        video.removeAttribute('src');
        video.load();
        video.hidden = true;
        comingSoon.hidden = false;
      }
    }

    window.addEventListener('hashchange', show);
    show();
  </script>
</body>
</html>
