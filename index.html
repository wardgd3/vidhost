<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Host</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 768px) {
      body { flex-direction: row; }
    }
    /* On mobile the player comes first and the menu fills the space below it. */
    .sidebar {
      order: 1;
      flex: 1;
      background: #181818;
      border-top: 1px solid #2a2a2a;
      padding: 1rem;
    }
    @media (min-width: 768px) {
      .sidebar {
        order: 0;
        flex: none;
        width: 240px;
        border-top: none;
        border-right: 1px solid #2a2a2a;
        padding: 1.5rem 1rem;
      }
    }
    .sidebar h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin: 0 0.75rem 0.75rem;
    }
    .menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .menu a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      color: #ccc;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .menu a:hover { background: #242424; color: #fff; }
    .menu a.active { background: #2d2d2d; color: #fff; font-weight: 600; }
    .menu + h2 { margin-top: 1.5rem; }
    .badge {
      font-size: 0.7rem;
      color: #888;
      white-space: nowrap;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    @media (min-width: 600px) {
      main { padding: 2rem; }
    }
    @media (min-width: 768px) {
      main { flex: 1; }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .player {
      width: 100%;
      max-width: 900px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    video {
      width: 100%;
      display: block;
    }
    .coming-soon {
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 1.1rem;
    }
    .carousel {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin-top: 1.5rem;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    .carousel-track {
      display: flex;
      transition: transform 0.35s ease;
    }
    .carousel-track a {
      flex: 0 0 100%;
      aspect-ratio: 16 / 10;
      display: block;
    }
    .carousel-track img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 2.5rem;
      height: 2.5rem;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
    }
    .carousel-btn:hover { background: rgba(0, 0, 0, 0.85); }
    .carousel-btn.prev { left: 0.75rem; }
    .carousel-btn.next { right: 0.75rem; }
    .carousel-dots {
      position: absolute;
      bottom: 0.75rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
    }
    .carousel-dots button {
      width: 0.6rem;
      height: 0.6rem;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      cursor: pointer;
    }
    .carousel-dots button.active { background: #fff; }
    [hidden] { display: none !important; }
    footer {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>
  <nav class="sidebar" id="sidebar"></nav>
  <main>
    <h1 id="title"></h1>
    <div class="player">
      <video id="video" controls playsinline preload="auto">
        Your browser does not support the video tag.
      </video>
      <div class="coming-soon" id="coming-soon" hidden>Video coming soon</div>
    </div>
    <div class="carousel" id="carousel" hidden>
      <div class="carousel-track" id="carousel-track"></div>
      <button class="carousel-btn prev" id="carousel-prev" aria-label="Previous image">&#8249;</button>
      <button class="carousel-btn next" id="carousel-next" aria-label="Next image">&#8250;</button>
      <div class="carousel-dots" id="carousel-dots"></div>
    </div>
    <footer>Self-hosted video</footer>
  </main>
  <script>
    // Add new videos here. Leave src empty to show "coming soon".
    // Videos with the same section are grouped under one heading in the menu.
    // Optional images are shown in a carousel under the video.
    const videos = [
      { id: 'fight-arena', section: 'Videos', title: 'Fight Arena', src: 'videos/fight_arena_web.mp4' },
      { id: 'shotguns-dual-wield', section: 'Videos', title: 'Shotguns and Dual Wield', src: '' },
      { id: 'castle-defender', section: 'Videos', title: 'Castle Defender', src: '' },
      { id: 'temple-swingshot', section: 'Temple', title: 'Swingshot Test', src: 'videos/temple_swingshot_web.mp4' },
      { id: 'conquest-showcase', section: 'Conquest', title: 'Conquest Showcase', src: 'videos/conquest_showcase1_web.mp4' },
      { id: 'conquest-medieval-showcase', section: 'Conquest', title: 'Medieval Showcase', src: 'videos/conquest_medieval_showcase1_web.mp4' },
      { id: 'titan-showcase', section: 'Titan', title: 'Titan Showcase', src: 'videos/titan_showcase1_web.mp4',
        images: [
          'images/titans/Screenshot 2026-11-21 142318.png',
          'images/titans/Screenshot 2026-11-21 142347.png',
          'images/titans/Screenshot 2026-11-21 142419.png',
          'images/titans/Screenshot 2026-11-21 142437.png',
        ] },
    ];

    const sidebar = document.getElementById('sidebar');
    const title = document.getElementById('title');
    const video = document.getElementById('video');
    const comingSoon = document.getElementById('coming-soon');
    const carousel = document.getElementById('carousel');
    const track = document.getElementById('carousel-track');
    const dots = document.getElementById('carousel-dots');
    let slide = 0;

    const menus = {};
    videos.forEach(v => {
      if (!menus[v.section]) {
        const heading = document.createElement('h2');
        heading.textContent = v.section;
        menus[v.section] = document.createElement('ul');
        menus[v.section].className = 'menu';
        sidebar.append(heading, menus[v.section]);
      }
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + v.id;
      a.dataset.id = v.id;
      a.textContent = v.title;
      if (!v.src) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = 'Coming soon';
        a.appendChild(badge);
      }
      li.appendChild(a);
      menus[v.section].appendChild(li);
    });

    function goTo(i) {
      const count = track.children.length;
      slide = (i + count) % count;
      track.style.transform = 'translateX(' + (-100 * slide) + '%)';
      [...dots.children].forEach((d, j) => d.classList.toggle('active', j === slide));
    }

    function showImages(images) {
      track.replaceChildren();
      dots.replaceChildren();
      carousel.hidden = !images.length;
      images.forEach((path, i) => {
        const src = encodeURI(path);
        const a = document.createElement('a');
        a.href = src;
        a.target = '_blank';
        const img = document.createElement('img');
        img.src = src;
        img.alt = 'Screenshot ' + (i + 1);
        img.loading = 'lazy';
        a.appendChild(img);
        track.appendChild(a);
        const dot = document.createElement('button');
        dot.setAttribute('aria-label', 'Show image ' + (i + 1));
        dot.addEventListener('click', () => goTo(i));
        dots.appendChild(dot);
      });
      if (images.length) goTo(0);
    }

    document.getElementById('carousel-prev').addEventListener('click', () => goTo(slide - 1));
    document.getElementById('carousel-next').addEventListener('click', () => goTo(slide + 1));

    function show() {
      const current = videos.find(v => '#' + v.id === location.hash) || videos[0];
      title.textContent = current.title;
      document.title = current.title + ' | Video Host';
      sidebar.querySelectorAll('a').forEach(a => {
        a.classList.toggle('active', a.dataset.id === current.id);
      });
      video.pause();
      if (current.src) {
        video.src = current.src;
        video.hidden = false;
        comingSoon.hidden = true;
      } else {
        video.removeAttribute('src');
        video.load();
        video.hidden = true;
        comingSoon.hidden = false;
      }
      showImages(current.images || []);
    }

    window.addEventListener('hashchange', show);
    show();
  </script>
</body>
</html>
